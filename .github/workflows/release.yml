# 每次 push 到 main 自动打安卓包，发到 GitHub Releases。
# 下载页（云函数 /api/releases）会读这里的列表给合伙人下载。
name: release-apk

on:
  push:
    branches: [main]

# 连续推送时只保留最新一次构建，别排队浪费
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 打包 APK（release 构建，Flutter 默认用 debug 签名，可直接安装）
        working-directory: frontend
        run: |
          flutter pub get
          flutter build apk --release

      - name: 整理产物名
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk xinyuan-b${{ github.run_number }}.apk

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 人生清单 b${{ github.run_number }}
          generate_release_notes: true
          files: xinyuan-b${{ github.run_number }}.apk
