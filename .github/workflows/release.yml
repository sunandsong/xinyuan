# 每次 push 到 main 自动打安卓包，发到 GitHub Releases。
# 下载页（云函数 /api/releases）会读这里的列表给合伙人下载。
name: release-apk

on:
  push:
    branches: [main]

# 连续推送时只保留最新一次构建，别排队浪费
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 release 需要
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成更新说明要看历史提交和上个 tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 打包 APK（只打 arm64，包体从 ~74MB 瘦到 ~28MB；debug 签名可直接安装）
        working-directory: frontend
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: 整理产物名
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk xinyuan-b${{ github.run_number }}.apk

      - name: 上传到腾讯云存储（国内高速下载；仓库没配密钥就跳过）
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          if [ -z "$TCB_SECRET_ID" ]; then
            echo "未配置 TCB_SECRET_ID/TCB_SECRET_KEY，跳过国内镜像上传"
            exit 0
          fi
          npm i -g @cloudbase/cli
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb storage upload xinyuan-b${{ github.run_number }}.apk \
            releases/xinyuan-b${{ github.run_number }}.apk \
            -e renshengqingdan-d8feva5q55d12bab

      - name: 生成更新说明（上一版以来的提交记录，标题+正文）
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo 'NOTES<<NOTES_EOF'
            git log $RANGE --no-merges --pretty=format:'%H%n' | head -50 | while read -r sha; do
              git log -1 --format='· %s' "$sha"
              # 正文按要点列出，去掉 Co-Authored-By 这类工具生成的尾注
              git log -1 --format='%b' "$sha" \
                | grep -v '^Co-Authored-By' \
                | sed '/^$/d; s/^/  /'
            done
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 人生清单 b${{ github.run_number }}
          body: ${{ steps.notes.outputs.NOTES }}
          files: xinyuan-b${{ github.run_number }}.apk
